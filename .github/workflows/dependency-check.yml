name: Dependency Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/dependency-check.yml'
      - '.github/scripts/check-vulnerabilities.sh'
      - 'Directory.Packages.props'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-dependencies:
    name: Scan for vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore library solution
        run: dotnet restore src/DiscogsApiClient.slnx

      # High/Critical severity findings fail the job (::error:: + exit 1).
      # Moderate/Low severity findings are reported as ::warning:: only and don't fail the job.
      # All findings are written to the job summary regardless of severity.
      - name: Check library solution for vulnerable packages
        run: bash .github/scripts/check-vulnerabilities.sh src/DiscogsApiClient.slnx
