name: CI - Library

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/ci-library.yml'
      - 'global.json'
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  validate-library:
    name: Build, Test & Analyze (Library)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/DiscogsApiClient.slnx

      - name: Build
        run: dotnet build src/DiscogsApiClient.slnx -c Release --no-restore -p:EnforceCodeStyleInBuild=true -warnaserror

      - name: Format check
        if: always()
        run: bash .github/scripts/format-check.sh src/DiscogsApiClient.slnx

      - name: Test with coverage
        if: always()
        run: |
          dotnet test src/DiscogsApiClient.slnx -c Release --no-build \
            --results-directory ./TestResults \
            -- --report-trx --coverage --coverage-output-format cobertura

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Library Test Results
          path: 'TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true
          fail-on-empty: false

      - name: Generate coverage summary
        if: always() && hashFiles('TestResults/*.cobertura.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'TestResults/*.cobertura.xml'
          targetdir: 'CoverageReport'
          reporttypes: 'MarkdownSummaryGithub'

      - name: Add coverage to job summary
        if: always() && hashFiles('CoverageReport/SummaryGithub.md') != ''
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report artifact
        if: always() && hashFiles('CoverageReport/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: library-coverage-report
          path: CoverageReport/
