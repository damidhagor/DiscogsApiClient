name: CI - Demo

on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/ci-demo.yml'
      - 'global.json'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-demo:
    name: Build & Analyze (Demo)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore demo/DiscogsApiClientDemo.slnx

      - name: Build
        shell: bash
        run: dotnet build demo/DiscogsApiClientDemo.slnx -c Release --no-restore -p:EnforceCodeStyleInBuild=true -warnaserror

      - name: Format check
        if: always()
        shell: bash
        run: bash .github/scripts/format-check.sh demo/DiscogsApiClientDemo.slnx
