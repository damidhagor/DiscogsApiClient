name: CI - Demo

on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/ci-demo.yml'
      - '.github/scripts/annotate-diagnostics.sh'
      - 'global.json'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-demo:
    name: Build & Analyze
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore demo/DiscogsApiClientDemo.slnx

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build demo/DiscogsApiClientDemo.slnx -c Release --no-restore /p:EnforceCodeStyleInBuild=true | tee build.log

      - name: Annotate build warnings (non-failing)
        if: always()
        shell: bash
        run: bash .github/scripts/annotate-diagnostics.sh build.log

      - name: Format check
        if: always()
        shell: bash
        run: |
          dotnet format demo/DiscogsApiClientDemo.slnx --verify-no-changes --severity info --no-restore | tee format.log || true

      - name: Annotate format diagnostics (non-failing)
        if: always()
        shell: bash
        run: bash .github/scripts/annotate-diagnostics.sh format.log
